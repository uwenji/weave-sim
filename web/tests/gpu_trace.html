<!doctype html><html><head><meta charset="utf-8"><title>GPU trace</title></head>
<body><pre id="out">running…</pre>
<script type="module">
// CPU and GPU states side by side at checkpoints (where a divergence starts): positions, velocities, frames, body
// angular velocities per axis, section forces and moments, kinetic energy, residual (with its force / torque parts),
// contact state. ?case=…  &cps=1,2,…  (or &from=a&to=b&every=k)  &tol=…
import { CpuSolver } from '../js/solver_cpu.js';
import { GpuSolver, getDevice } from '../js/solver_gpu.js';
import { caseByName } from './browser_cases.js';
const q = new URLSearchParams(location.search);
const name = q.get('case') || 'cantilever';
let cps = (q.get('cps') || '1,2,3,5,10,50,100,300,301,302,310,350,500,1000').split(',').map(Number);
if (q.get('from')) { cps = []; for (let i = +q.get('from'); i <= +q.get('to'); i += +(q.get('every') || 1)) cps.push(i); }
const out = document.getElementById('out'); const lines = [];
const log = (s) => { lines.push(s); out.textContent = lines.join('\n'); console.log(s); };
const mx = (a, b) => { let m = 0; for (let i = 0; i < a.length; i++) m = Math.max(m, Math.abs(a[i] - b[i])); return m; };
const mxc = (a, b, c, s = 3) => { let m = 0; for (let i = c; i < a.length; i += s) m = Math.max(m, Math.abs(a[i] - b[i])); return m; };
const mvc = (a, c, s = 3) => { let m = 0; for (let i = c; i < a.length; i += s) m = Math.max(m, Math.abs(a[i])); return m; };
const mv = (a) => { let m = 0; for (const v of a) m = Math.max(m, Math.abs(v)); return m; };
const e = (v, d = 2) => (Number.isFinite(v) ? v.toExponential(d) : String(v));
(async () => {
  const dev = await getDevice();
  const { sc, topo, contacts } = await caseByName(name);
  if (q.get('tol')) sc.solver.tol = +q.get('tol');
  const cpu = new CpuSolver(sc, topo, { contacts });
  const model = new CpuSolver(sc, topo, { contacts });
  const gpu = new GpuSolver(dev, [model], { perSubmit: 50 });
  log(`${name}: PB ${gpu.PB} FB ${gpu.FB} TB ${gpu.TB} KB ${gpu.KB}`);
  let done = 0;
  for (const cp of cps) {
    while (cpu.st.iteration < cp && !cpu.converged) cpu.step(1);
    if (cp > done) { await gpu.step(cp - done, { force: false }); done = cp; }
    await gpu.download(0);
    const a = cpu.st, b = model.st, A = cpu.beam, G = model.beam;
    let disp = 0; for (let i = 0; i < a.X.length; i++) disp = Math.max(disp, Math.abs(a.X[i] - a.X0[i]));
    let s = `it ${String(a.iteration).padStart(5)}/${b.iteration}  dX ${e(mx(a.X, b.X))} (disp ${e(disp)})  dV ${e(mx(a.V, b.V))}/${e(mv(a.V))}  dQ ${e(mx(a.Q, b.Q))}`;
    s += `  dW xyz ${e(mxc(a.Wr, b.Wr, 0))} ${e(mxc(a.Wr, b.Wr, 1))} ${e(mxc(a.Wr, b.Wr, 2))} / ${e(mvc(a.Wr, 0))} ${e(mvc(a.Wr, 1))} ${e(mvc(a.Wr, 2))}`;
    s += `  N ${e(mx(A.N, G.N))}/${e(mv(A.N))}  V ${e(mx(A.V, G.V))}/${e(mv(A.V))}  M ${e(mxc(A.M, G.M, 0))}/${e(mvc(A.M, 0))} ${e(mxc(A.M, G.M, 1))}/${e(mvc(A.M, 1))} ${e(mxc(A.M, G.M, 2))}/${e(mvc(A.M, 2))}`;
    s += `  ke ${e(cpu.kePrev, 4)}/${e(model.kePrev, 4)}  res ${e(a.residual)}/${e(b.residual)} [f ${e(cpu.residualParts?.force)}/${e(model.residualParts?.force)} t ${e(cpu.residualParts?.torque)}/${e(model.residualParts?.torque)}]`;
    if (cpu.contact) s += `  Fn ${cpu.contact.Fn[0].toFixed(6)}/${model.contact.Fn[0].toFixed(6)} Ft ${e(cpu.contact.Ft[0], 4)}/${e(model.contact.Ft[0], 4)} gap ${cpu.contact.gap[0].toFixed(7)}/${model.contact.gap[0].toFixed(7)} u ${a.u[0].toFixed(7)},${a.u[1].toFixed(7)}/${b.u[0].toFixed(7)},${b.u[1].toFixed(7)} st ${cpu.contact.state[0]}/${model.contact.state[0]} slip ${a.slip[0].toFixed(6)}/${b.slip[0].toFixed(6)}`;
    log(s);
  }
  window.__done = true;
})();
</script></body></html>
